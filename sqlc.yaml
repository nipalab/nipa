version: "2"
sql:
  - engine: "sqlite"
    schema: "db/migrations/sqlite"
    queries: "db/queries/sqlite"
    gen:
      go:
        package: "sqlite"
        out: "internal/repository/sqlc/sqlite"
        emit_json_tags: true
        emit_interface: true

  - engine: "sqlite"
    schema: "internal/client/localrepo/schema"
    queries: "internal/client/localrepo/queries"
    gen:
      go:
        package: "localrepo"
        out: "internal/repository/sqlc/localrepo"
        emit_json_tags: true
        emit_interface: true

  - engine: "postgresql"
    schema: "ee/db/migrations/postgres"
    queries: "ee/repository/postgres/queries"
    gen:
      go:
        package: "postgres"
        out: "ee/repository/postgres/sqlc"
        emit_json_tags: true
        emit_interface: true
        overrides:
          - db_type: "pg_catalog.int4"
            go_type: "int64"
