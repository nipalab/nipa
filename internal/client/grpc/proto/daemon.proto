syntax = "proto3";

package nipadaemon;
option go_package = "./daemonpb";

// Loopback daemon API consumed by GUI clients (desktop, Explorer, engine
// plugins). Every working-copy operation is scoped by an absolute `root`
// (a clone with a .nipa/config); remote operations are proxied through the
// daemon's warm, authenticated transport. Proxy request/response pairs reuse
// the server proto messages verbatim, with the daemon filling `context` from
// the clone config (clients may leave it unset).

import "internal/grpc/proto/server.proto";

message PingRequest {}

message PingResponse {
    string version = 1;
    int32 pid = 2;
}

message ShutdownRequest {}

message ShutdownResponse {}

message LoginRequest {
    string host = 1;
    string username = 2;
    string password = 3;
}

message LoginResponse {}

message RepoInfo {
    string root = 1;
    string url = 2;
    string branch = 3;
    repeated string sparse = 4;
}

message WatchRepoRequest {
    string root = 1;
}

message WatchRepoResponse {
    RepoInfo repo = 1;
}

message UnwatchRepoRequest {
    string root = 1;
}

message UnwatchRepoResponse {}

message ListReposRequest {}

message ListReposResponse {
    repeated RepoInfo repos = 1;
}

message StatusRequest {
    string root = 1;
    bool no_cache = 2;
}

message StatusResponse {
    repeated string staged = 1;
    repeated string deleted = 2;
    repeated string modified = 3;
    repeated string untracked = 4;
    repeated string missing = 5;
    repeated string conflicts = 6;
    string branch = 7;
    StatusHead head = 8; // set when HEAD is detached
    repeated string added = 9; // subset of staged: paths the synced snapshot does not track yet
    string pending = 10; // merge or revert while it waits for continue/abort
    int32 pending_remaining = 11; // revert targets still to apply, the current one included
}

message StatusHead {
    string kind = 1;
    string name = 2;
}

message StageRequest {
    string root = 1;
    repeated string add = 2; // paths/directories to stage, including tracked deletions
    repeated string unstage = 3; // staged paths to drop from the staged set
}

message RestoreRequest {
    string root = 1;
    repeated string paths = 2; // files/directories to restore from the last synced tree
}

message UpdateRequest {
    string root = 1;
}

message SwitchRequest {
    string root = 1;
    string branch = 2;
    string tag = 3; // when set, detaches HEAD at this tag instead of switching to a branch
}

message PushRequest {
    string root = 1;
    string message = 2;
}

message MergeOpRequest {
    string root = 1;
    string source_branch = 2;
    bool abort = 3;
    bool ff_only = 4;
    bool no_ff = 5;
    string message = 6;
}

message RevertOpRequest {
    string root = 1;
    string target = 2; // commit ID, hash, or <from>..<to> range
    bool abort = 3;
    bool continue = 4;
    bool skip = 5;
    bool no_commit = 6;
    int32 mainline = 7;
    string message = 8;
}

message DiffRequest {
    string root = 1;
    repeated string revisions = 2; // 0-2 revisions; <a>..<b> shapes are expanded client-side
    repeated string paths = 3;
    bool staged = 4;
    bool no_cache = 5;
    bool merge_base = 6; // three-dot <a>...<b> diff against the merge base
    string format = 7; // patch, stat, name_only, name_status
    bool ignore_all_space = 8; // -w
    bool ignore_space_change = 9; // -b
    int32 context = 10; // context lines for the patch format; 0 uses the default
    bool show = 11; // with one revision: compare it with its first parent (empty tree for a root commit)
}

message DiffEvent {
    oneof event {
        bytes data = 1; // rendered output chunk
        OpFailure failure = 2;
    }
}

// DiffFileSide describes one side of a changed file; absent for the missing
// side of an addition or deletion.
message DiffFileSide {
    string path = 1;
    int32 mode = 2;
    int64 size_bytes = 3;
    bool is_binary = 4;
    string hash = 5; // hex file hash; empty for an untracked working file
}

// DiffFile is one changed path. Text files carry their hunks unless the
// rendered hunks exceed the per-file budget (hunks_omitted); binary files only
// carry metadata and a viewer kind for the GUI to fetch previews.
message DiffFile {
    string path = 1;
    string status = 2; // added, modified, deleted, renamed
    string kind = 3; // text, image, model, audio, video, font, table, opaque
    int32 similarity = 4; // rename similarity percentage
    DiffFileSide old = 5;
    DiffFileSide new = 6;
    int64 additions = 7;
    int64 deletions = 8;
    repeated greet.DiffHunkDetail hunks = 9;
    bool hunks_omitted = 10;
    bool content_unavailable = 11;
}

message DiffFileEvent {
    oneof event {
        DiffFile file = 1;
        OpFailure failure = 2;
    }
}

// BlobRef names one file version: the working copy (default), the last synced
// snapshot (the old side of a working-copy diff, offline) or a revision.
message BlobRef {
    string source = 1; // working, snapshot, revision
    string revision = 2; // branch, tag, commit id or HEAD when source is revision
    string path = 3; // repository-relative
}

message ReadBlobRequest {
    string root = 1;
    BlobRef blob = 2;
}

message BlobInfo {
    string path = 1;
    int64 size_bytes = 2;
    bool is_binary = 3;
    string hash = 4; // hex; empty for a working-copy file
    string kind = 5;
}

// BlobEvent streams info first, then the decoded content in 64 KiB chunks.
message BlobEvent {
    oneof event {
        BlobInfo info = 1;
        bytes data = 2;
        OpFailure failure = 3;
    }
}

// PreviewRequest decodes one or both sides of an image change. Unsupported
// formats fail with code 415 so the GUI can fall back to a metadata view.
message PreviewRequest {
    string root = 1;
    BlobRef old = 2;
    BlobRef new = 3;
    int32 max_size = 4; // longest preview side in pixels; 0 = 2048
    int32 threshold = 5; // per-channel delta ignored by the pixel diff (0-255)
    int32 level = 6; // mip level of textures; clamped to the last level
    int32 face = 7; // cube face or array layer of textures; clamped
}

// ImageLayer is one Photoshop layer or group, top-most first.
message ImageLayer {
    string name = 1;
    string kind = 2; // layer or group
    int32 depth = 3; // group nesting
    bool visible = 4;
    int32 opacity = 5; // 0-255
    string blend = 6; // Photoshop blend key, e.g. norm, mul
    int32 x = 7;
    int32 y = 8;
    int32 width = 9;
    int32 height = 10;
    string hash = 11; // fingerprint of the layer's pixel data
}

message ImagePreview {
    string side = 1; // old or new
    int32 width = 2;
    int32 height = 3;
    string format = 4;
    int32 bit_depth = 5;
    bool has_alpha = 6;
    int64 size_bytes = 7;
    int32 preview_width = 8;
    int32 preview_height = 9;
    string encoding = 10; // pixel format or compression, e.g. BC7_UNORM, ZIP
    int32 levels = 11;
    int32 faces = 12;
    bool cube = 13;
    int32 level = 14; // the surface actually decoded
    int32 face = 15;
    // hdr marks a float source: the PNG is twice preview_width wide, RGBE
    // mantissas on the left and exponent (red) plus alpha (green) on the
    // right, so the GUI can apply its own exposure.
    bool hdr = 16;
    repeated ImageLayer layers = 17;
}

message PreviewData {
    string side = 1;
    bytes png = 2; // chunk of the downscaled PNG for that side
}

message ImageDiffStats {
    int64 changed_pixels = 1;
    int64 total_pixels = 2;
    double changed_ratio = 3;
    int32 max_delta = 4;
    int32 bounds_x = 5;
    int32 bounds_y = 6;
    int32 bounds_width = 7;
    int32 bounds_height = 8;
    bool size_changed = 9;
    bool format_changed = 10;
    bool bit_depth_changed = 11;
    bool alpha_changed = 12;
}

// PreviewEvent order per side: image, then its PNG data chunks; diff stats
// come last when both sides were requested.
message PreviewEvent {
    oneof event {
        ImagePreview image = 1;
        PreviewData data = 2;
        ImageDiffStats diff = 3;
        OpFailure failure = 4;
    }
}

message WatchChangesRequest {
    string root = 1;
}

// RepoChange tells a subscriber the working copy may have changed. paths lists
// the files the watcher saw; it is empty when the whole clone should be
// refreshed (after an operation, a stage/restore, or a very large batch).
message RepoChange {
    repeated string paths = 1;
}

message OpQueued {
    int32 ahead = 1; // exclusive operations ahead of this one
}

message OpStarted {
    string phase = 1;
}

message OpProgress {
    string phase = 1; // e.g. download, upload, apply
    int64 objects_done = 2;
    int64 objects_total = 3;
    int64 bytes_done = 4;
    int64 bytes_total = 5;
}

message OpFailure {
    int32 code = 1; // HTTP-style code: 400, 401, 403, 404, 409, 500
    string message = 2;
}

message SyncResult {
    string branch = 1;
    string commit_id = 2; // base36 snow ID of the new head
}

message PushResult {
    string commit_id = 1; // base36 snow ID
    string commit_hash = 2; // hex-encoded BLAKE3 hash
    string tree_hash = 3; // hex-encoded root tree hash
}

message MergeResult {
    bool up_to_date = 1;
    bool fast_forwarded = 2;
    bool merge_committed = 3;
    bool aborted = 4;
    repeated string conflicts = 5;
}

message RevertResult {
    bool committed = 1;
    bool no_change = 2;
    bool skipped = 3;
    bool aborted = 4;
    repeated string conflicts = 5;
}

message OpResult {
    oneof outcome {
        SyncResult sync = 1; // update and switch
        PushResult push = 2;
        MergeResult merge = 3;
        RevertResult revert = 4;
    }
}

message OpEvent {
    oneof event {
        OpQueued queued = 1;
        OpStarted started = 2;
        OpProgress progress = 3;
        OpResult result = 4;
        OpFailure failure = 5;
    }
}

message ProxyBranchListRequest {
    string root = 1;
    greet.GetListBranchRequest request = 2;
}

message ProxyBranchListResponse {
    greet.GetListBranchResponse response = 1;
}

message ProxyBranchCreateRequest {
    string root = 1;
    greet.CreateBranchRequest request = 2;
}

message ProxyBranchCreateResponse {
    greet.CreateBranchResponse response = 1;
}

message ProxyBranchDeleteRequest {
    string root = 1;
    greet.DeleteBranchRequest request = 2;
}

message ProxyBranchDeleteResponse {
    greet.DeleteBranchResponse response = 1;
}

message ProxyTreeManifestRequest {
    string root = 1;
    greet.GetTreeManifestRequest request = 2;
}

message ProxyTreeManifestResponse {
    greet.GetTreeManifestResponse response = 1;
}

message ProxyCommitLogRequest {
    string root = 1;
    greet.GetCommitLogRequest request = 2;
}

message ProxyCommitLogResponse {
    greet.GetCommitLogResponse response = 1;
}

message ProxyCommitGetRequest {
    string root = 1;
    greet.GetCommitRequest request = 2;
}

message ProxyCommitGetResponse {
    greet.GetCommitResponse response = 1;
}

message ProxyCommitWalkRequest {
    string root = 1;
    greet.WalkCommitsRequest request = 2;
}

message ProxyCommitWalkResponse {
    greet.WalkCommitsResponse response = 1;
}

message ProxyMergeBaseRequest {
    string root = 1;
    greet.GetMergeBaseRequest request = 2;
}

message ProxyMergeBaseResponse {
    greet.GetMergeBaseResponse response = 1;
}

message ProxyMergeRequestListRequest {
    string root = 1;
    greet.ListMergeRequestsRequest request = 2;
}

message ProxyMergeRequestListResponse {
    greet.ListMergeRequestsResponse response = 1;
}

message ProxyMergeRequestCreateRequest {
    string root = 1;
    greet.CreateMergeRequestRequest request = 2;
}

message ProxyMergeRequestCreateResponse {
    greet.CreateMergeRequestResponse response = 1;
}

message ProxyMergeRequestMergeRequest {
    string root = 1;
    greet.MergeMergeRequestRequest request = 2;
}

message ProxyMergeRequestMergeResponse {
    greet.MergeMergeRequestResponse response = 1;
}

message ProxyMergeRequestCloseRequest {
    string root = 1;
    greet.CloseMergeRequestRequest request = 2;
}

message ProxyMergeRequestCloseResponse {
    greet.CloseMergeRequestResponse response = 1;
}

message ProxyMergeRequestReviewsRequest {
    string root = 1;
    greet.ListMergeRequestReviewsRequest request = 2;
}

message ProxyMergeRequestReviewsResponse {
    greet.ListMergeRequestReviewsResponse response = 1;
}

message ProxyMergeRequestReviewStateRequest {
    string root = 1;
    greet.GetMergeRequestReviewStateRequest request = 2;
}

message ProxyMergeRequestReviewStateResponse {
    greet.GetMergeRequestReviewStateResponse response = 1;
}

message ProxyMergeRequestThreadsRequest {
    string root = 1;
    greet.ListMergeRequestThreadsRequest request = 2;
}

message ProxyMergeRequestThreadsResponse {
    greet.ListMergeRequestThreadsResponse response = 1;
}

message ProxyMergeRequestGetRequest {
    string root = 1;
    greet.GetMergeRequestRequest request = 2;
}

message ProxyMergeRequestGetResponse {
    greet.GetMergeRequestResponse response = 1;
}

message ProxyMergeRequestCheckRequest {
    string root = 1;
    greet.CheckMergeRequestRequest request = 2;
}

message ProxyMergeRequestCheckResponse {
    greet.CheckMergeRequestResponse response = 1;
}

message ProxyMergeRequestReopenRequest {
    string root = 1;
    greet.ReopenMergeRequestRequest request = 2;
}

message ProxyMergeRequestReopenResponse {
    greet.ReopenMergeRequestResponse response = 1;
}

message ProxyMergeRequestSubmitReviewRequest {
    string root = 1;
    greet.SubmitMergeRequestReviewRequest request = 2;
}

message ProxyMergeRequestSubmitReviewResponse {
    greet.SubmitMergeRequestReviewResponse response = 1;
}

message ProxyLockFileRequest {
    string root = 1;
    greet.LockFileRequest request = 2;
}

message ProxyLockFileResponse {
    greet.LockFileResponse response = 1;
}

message ProxyUnlockFileRequest {
    string root = 1;
    greet.UnlockFileRequest request = 2;
}

message ProxyUnlockFileResponse {
    greet.UnlockFileResponse response = 1;
}

message ProxyListFileLocksRequest {
    string root = 1;
    greet.ListFileLocksRequest request = 2;
}

message ProxyListFileLocksResponse {
    greet.ListFileLocksResponse response = 1;
}

message ProxyTagListRequest {
    string root = 1;
    greet.ListTagsRequest request = 2;
}

message ProxyTagListResponse {
    greet.ListTagsResponse response = 1;
}

message ProxyTagCreateRequest {
    string root = 1;
    greet.CreateTagRequest request = 2;
}

message ProxyTagCreateResponse {
    greet.CreateTagResponse response = 1;
}

message ProxyTagDeleteRequest {
    string root = 1;
    greet.DeleteTagRequest request = 2;
}

message ProxyTagDeleteResponse {
    greet.DeleteTagResponse response = 1;
}

message LockStatusRequest {
    string root = 1;
}

message LockStatusResponse {
    string user_id = 1; // the signed-in account (base36), from the session's access token
    string branch = 2; // the configured branch the locks are scoped to
    bool default_branch = 3; // the branch is the default: project-global (mainline) locks apply
    bool can_release_any = 4; // the caller administers the project and may release anyone's lock
    repeated greet.FileLockDetail locks = 5; // every lock the caller can see, in any scope
    repeated FileLockState files = 6; // changed binary files and their lock state in the branch scope
}

message FileLockState {
    string path = 1;
    string state = 2; // mine, theirs, needed (tracked binary without a lock), free
    string lock_path = 3; // covering lock: the file or a directory prefix
    string held_by = 4;
    string held_by_name = 5;
    bool tracked = 6;
}

message AccountStatusRequest {
    string server = 1; // host, host:port or http(s) URL
}

message AccountStatusResponse {
    string host = 1; // the host sessions are stored under
    string address = 2; // what the daemon dials (keeps an http/https scheme)
    bool signed_in = 3;
    string email = 4; // empty for SSH-key sessions
    string user_id = 5;
}

message LoginSSHRequest {
    string server = 1;
    string email = 2; // optional: must own the key when set
}

message ListProjectsRequest {
    string server = 1;
}

message ListProjectsResponse {
    repeated greet.ProjectSummary projects = 1;
}

message RemoteBranchesRequest {
    string server = 1;
    string org = 2;
    string project = 3;
}

message RemoteBranchesResponse {
    repeated greet.Branch branches = 1;
}

message RemoteTreeRequest {
    string server = 1;
    string org = 2;
    string project = 3;
    string branch = 4; // empty: the default branch
    string path = 5; // directory to list; empty is the root
}

message RemoteTreeDir {
    string name = 1;
    string path = 2;
}

message RemoteTreeResponse {
    repeated RemoteTreeDir dirs = 1;
    int64 files = 2; // files directly in the directory
    int64 file_bytes = 3;
}

message CloneRequest {
    string url = 1; // repository URL: <server>/<org>/<project>
    string branch = 2; // empty: the default branch
    repeated string sparse = 3; // directory prefixes; empty: full checkout
    string target = 4; // empty or missing directory to clone into
}

message SetSparseRequest {
    string root = 1;
    repeated string paths = 2; // empty: full checkout
}

service NipaDaemon {
    rpc Ping(PingRequest) returns (PingResponse);
    rpc Shutdown(ShutdownRequest) returns (ShutdownResponse);
    rpc Login(LoginRequest) returns (LoginResponse);

    rpc WatchRepo(WatchRepoRequest) returns (WatchRepoResponse);
    rpc UnwatchRepo(UnwatchRepoRequest) returns (UnwatchRepoResponse);
    rpc ListRepos(ListReposRequest) returns (ListReposResponse);

    rpc Status(StatusRequest) returns (StatusResponse);
    rpc Stage(StageRequest) returns (StatusResponse);
    rpc Restore(RestoreRequest) returns (StatusResponse);

    rpc Update(UpdateRequest) returns (stream OpEvent);
    rpc Switch(SwitchRequest) returns (stream OpEvent);
    rpc Push(PushRequest) returns (stream OpEvent);
    rpc Merge(MergeOpRequest) returns (stream OpEvent);
    rpc Revert(RevertOpRequest) returns (stream OpEvent);
    rpc Diff(DiffRequest) returns (stream DiffEvent);
    rpc DiffFiles(DiffRequest) returns (stream DiffFileEvent); // structured; format is ignored
    rpc ReadBlob(ReadBlobRequest) returns (stream BlobEvent);
    rpc Preview(PreviewRequest) returns (stream PreviewEvent);
    rpc WatchChanges(WatchChangesRequest) returns (stream RepoChange);

    rpc ProxyBranchList(ProxyBranchListRequest) returns (ProxyBranchListResponse);
    rpc ProxyBranchCreate(ProxyBranchCreateRequest) returns (ProxyBranchCreateResponse);
    rpc ProxyBranchDelete(ProxyBranchDeleteRequest) returns (ProxyBranchDeleteResponse);
    rpc ProxyTagList(ProxyTagListRequest) returns (ProxyTagListResponse);
    rpc ProxyTagCreate(ProxyTagCreateRequest) returns (ProxyTagCreateResponse);
    rpc ProxyTagDelete(ProxyTagDeleteRequest) returns (ProxyTagDeleteResponse);
    rpc ProxyTreeManifest(ProxyTreeManifestRequest) returns (ProxyTreeManifestResponse);
    rpc ProxyCommitLog(ProxyCommitLogRequest) returns (ProxyCommitLogResponse);
    rpc ProxyCommitGet(ProxyCommitGetRequest) returns (ProxyCommitGetResponse);
    rpc ProxyCommitWalk(ProxyCommitWalkRequest) returns (ProxyCommitWalkResponse);
    rpc ProxyMergeBase(ProxyMergeBaseRequest) returns (ProxyMergeBaseResponse);
    rpc ProxyMergeRequestList(ProxyMergeRequestListRequest) returns (ProxyMergeRequestListResponse);
    rpc ProxyMergeRequestCreate(ProxyMergeRequestCreateRequest) returns (ProxyMergeRequestCreateResponse);
    rpc ProxyMergeRequestMerge(ProxyMergeRequestMergeRequest) returns (ProxyMergeRequestMergeResponse);
    rpc ProxyMergeRequestClose(ProxyMergeRequestCloseRequest) returns (ProxyMergeRequestCloseResponse);
    rpc ProxyMergeRequestReviews(ProxyMergeRequestReviewsRequest) returns (ProxyMergeRequestReviewsResponse);
    rpc ProxyMergeRequestReviewState(ProxyMergeRequestReviewStateRequest) returns (ProxyMergeRequestReviewStateResponse);
    rpc ProxyMergeRequestThreads(ProxyMergeRequestThreadsRequest) returns (ProxyMergeRequestThreadsResponse);
    rpc ProxyMergeRequestGet(ProxyMergeRequestGetRequest) returns (ProxyMergeRequestGetResponse);
    rpc ProxyMergeRequestCheck(ProxyMergeRequestCheckRequest) returns (ProxyMergeRequestCheckResponse);
    rpc ProxyMergeRequestReopen(ProxyMergeRequestReopenRequest) returns (ProxyMergeRequestReopenResponse);
    rpc ProxyMergeRequestSubmitReview(ProxyMergeRequestSubmitReviewRequest) returns (ProxyMergeRequestSubmitReviewResponse);
    rpc ProxyLockFile(ProxyLockFileRequest) returns (ProxyLockFileResponse);
    rpc ProxyUnlockFile(ProxyUnlockFileRequest) returns (ProxyUnlockFileResponse);
    rpc ProxyListFileLocks(ProxyListFileLocksRequest) returns (ProxyListFileLocksResponse);
    rpc LockStatus(LockStatusRequest) returns (LockStatusResponse);

    rpc AccountStatus(AccountStatusRequest) returns (AccountStatusResponse);
    rpc LoginSSH(LoginSSHRequest) returns (LoginResponse);
    rpc ListProjects(ListProjectsRequest) returns (ListProjectsResponse);
    rpc RemoteBranches(RemoteBranchesRequest) returns (RemoteBranchesResponse);
    rpc RemoteTree(RemoteTreeRequest) returns (RemoteTreeResponse);
    rpc Clone(CloneRequest) returns (stream OpEvent);
    rpc SetSparse(SetSparseRequest) returns (stream OpEvent);
}
