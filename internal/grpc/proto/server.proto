syntax = "proto3";

package greet;
option go_package = "./pb";

import "google/protobuf/timestamp.proto";

message ProjectContext {
    string org = 1;
    string project = 2;
}

enum FileMode {
    FILE_MODE_UNSPECIFIED = 0;
    FILE_MODE_READ_ONLY = 1;
    FILE_MODE_READ_WRITE = 2;
    FILE_MODE_EXECUTABLE = 3;
}

message FileNode {
    string path = 1;
    FileMode mode = 2;
    int64 size_bytes = 3;
    bool is_binary = 4;
    repeated string chunk_hashes = 5;
}

message TreeManifest {
    string tree_hash = 1;
    string path = 2; // Subdirectory path, e.g., "assets/shaders"
    repeated TreeManifest sub_trees = 3; // Child directory trees
    repeated FileNode files = 4;
}

message GetTreeManifestRequest {
    ProjectContext context = 1;
    string branch = 2;
    string path = 3;
    optional string tree_hash = 4;
    bool recursive = 5;
    repeated string paths = 6; // directory prefixes to include; empty = whole tree
}

message GetTreeManifestResponse {
    string branch = 1;
    TreeManifest root_tree = 2;
}

message PushFile {
    string path = 1; // repository-relative file path, e.g. "assets/logo.png"
    FileMode mode = 2;
    int64 size_bytes = 3;
    bool is_binary = 4;
    string file_hash = 5;
    repeated string chunk_hashes = 6;
}

message ChunkUploadRequest {
    ProjectContext context = 1; // required on the first message
    string hash = 2; // hex-encoded BLAKE3 hash of data
    bytes data = 3;
}

message UploadChunksResponse {
    int32 uploaded = 1;
    int32 skipped = 2;
}

message DownloadChunksRequest {
    string hash = 1; // hex-encoded BLAKE3 hash of data
    ProjectContext context = 2; // required on the first message
    repeated string commit_ids = 3; // base36 snow IDs; visible chunks are the union of these trees
    repeated string paths = 4; // optional path prefixes narrowing the visible chunks
}

message DownloadChunk {
    string hash = 1; // hex-encoded BLAKE3 hash of data
    bytes data = 2;
}

message PushRequest {
    ProjectContext context = 1;
    string branch = 2;
    string base_tree_hash = 3; // tree hash the client is based on, empty for branches without commits
    string message = 4;
    repeated PushFile files = 5;
    repeated string removed_files = 6; // paths removed relative to the base tree
    optional string parent_2_commit_hash = 7; // second parent for merge commits; empty for normal pushes
}

message PushResponse {
    string commit_id = 1;
    string commit_hash = 2;
    string tree_hash = 3;
}

message Branch {
    google.protobuf.Timestamp created_at = 1;
    google.protobuf.Timestamp updated_at = 2;
    string id = 3;
    string name = 4;
    optional string commit_id = 5;
    bool is_protected = 6;
    bool is_default = 7;
}

message GetListBranchRequest {
    ProjectContext context = 1;
    int32 limit = 2;
    optional google.protobuf.Timestamp last_updated_at = 3;
    optional string last_id = 4;
}

message GetListBranchResponse {
    repeated Branch branches = 1;
}

message GetBranchRequest {
    ProjectContext context = 1;
    string branch_id = 2; // base36 snow ID
}

message GetBranchByNameRequest {
    ProjectContext context = 1;
    string name = 2;
}

message GetBranchByNameResponse {
    Branch branch = 1;
}

message GetDefaultBranchRequest {
    ProjectContext context = 1;
}

message GetBranchResponse {
    Branch branch = 1;
}

message CreateBranchRequest {
    ProjectContext context = 1;
    string name = 2;
    string from_branch = 3; // branch to fork from; empty to fork from the default branch
    string from_commit_id = 4; // exact commit to fork from (base36 snow ID); takes precedence over from_commit_hash and from_branch
    string from_commit_hash = 5; // exact commit to fork from (hex content hash); takes precedence over from_branch
}

message CreateBranchResponse {
    Branch branch = 1;
}

message GetMergeBaseRequest {
    ProjectContext context = 1;
    string target_branch = 2; // used when target_commit_id is empty
    string source_branch = 3; // used when source_commit_id is empty
    optional string target_commit_id = 4; // base36 snow ID; takes precedence over target_branch
    optional string source_commit_id = 5; // base36 snow ID; takes precedence over source_branch
}

message GetMergeBaseResponse {
    string target_branch = 1;
    string source_branch = 2;
    string target_commit_id = 3; // base36 snow ID; empty when the branch has no commits
    string source_commit_id = 4; // base36 snow ID; empty when the branch has no commits
    string merge_base_commit_id = 5; // base36 snow ID; empty when either head is empty
    TreeManifest merge_base_tree = 6; // recursive manifest of the merge base tree
    string target_commit_hash = 7; // hex commit hash; empty when the branch has no commits
    string source_commit_hash = 8; // hex commit hash; empty when the branch has no commits
}

message MergeFastForwardRequest {
    ProjectContext context = 1;
    string target_branch = 2;
    string source_branch = 3;
}

message MergeFastForwardResponse {
    Branch branch = 1; // the target branch after the head moved to the source head
    string moved_to_commit_id = 2; // base36 snow ID of the source head the target now points at
}

message CommitLogEntry {
    string commit_id = 1; // base36 snow ID
    string commit_hash = 2; // hex-encoded BLAKE3 content hash
    optional string parent_1_id = 3; // base36 snow ID; empty for a root commit
    optional string parent_2_id = 4; // base36 snow ID; set for merge commits
    string author_name = 5;
    string author_email = 6;
    string message = 7;
    google.protobuf.Timestamp created_at = 8;
}

message GetCommitLogRequest {
    ProjectContext context = 1;
    string branch = 2; // empty to use the default branch
    optional string start_commit_id = 3; // base36 snow ID; empty to start from the branch head
    int32 limit = 4;
}

message GetCommitLogResponse {
    string branch = 1;
    repeated CommitLogEntry commits = 2;
}

message CommitDetail {
    string commit_id = 1; // base36 snow ID
    string commit_hash = 2; // hex-encoded BLAKE3 content hash
    string tree_hash = 3; // hex-encoded root tree hash
    optional string parent_1_id = 4; // base36 snow ID; empty for a root commit
    optional string parent_2_id = 5; // base36 snow ID; set for merge commits
    string message = 6;
    google.protobuf.Timestamp created_at = 7;
}

message GetCommitRequest {
    ProjectContext context = 1;
    string commit_id = 2; // base36 snow ID
}

message GetCommitResponse {
    CommitDetail commit = 1;
    TreeManifest root_tree = 2; // recursive manifest of the commit tree
}

message CommitWalkEntry {
    string commit_id = 1; // base36 snow ID
    string commit_hash = 2; // hex-encoded BLAKE3 content hash
    optional string parent_1_id = 3; // base36 snow ID; empty for a root commit
    optional string parent_2_id = 4; // base36 snow ID; set for merge commits
    string message = 5;
    google.protobuf.Timestamp created_at = 6;
}

message WalkCommitsRequest {
    ProjectContext context = 1;
    string start_commit_id = 2; // base36 snow ID; walk starts here (inclusive)
    optional string stop_commit_id = 3; // base36 snow ID; exclusive boundary
    int32 limit = 4;
}

message WalkCommitsResponse {
    repeated CommitWalkEntry commits = 1; // newest first
}

message LoginUsernamePasswordRequest {
    string username = 1;
    string password = 2;
}

message LoginWithRefreshRequest {
    string refresh_token = 1;
}

message LoginResponse {
    string access_token = 1;
    string refresh_token = 2;
    int32 expires_in = 3;
}

service NipaService {
    rpc LoginWithUsernamePassword(LoginUsernamePasswordRequest) returns (LoginResponse);
    rpc LoginWithRefreshToken(LoginWithRefreshRequest) returns (LoginResponse);

    rpc GetListBranch(GetListBranchRequest) returns (GetListBranchResponse);
    rpc GetBranch(GetBranchRequest) returns (GetBranchResponse);
    rpc GetBranchByName(GetBranchByNameRequest) returns (GetBranchByNameResponse);
    rpc GetDefaultBranch(GetDefaultBranchRequest) returns (GetBranchResponse);
    rpc CreateBranch(CreateBranchRequest) returns (CreateBranchResponse);
    rpc GetTreeManifest(GetTreeManifestRequest) returns (GetTreeManifestResponse);
    rpc GetCommitLog(GetCommitLogRequest) returns (GetCommitLogResponse);
    rpc GetCommit(GetCommitRequest) returns (GetCommitResponse);
    rpc WalkCommits(WalkCommitsRequest) returns (WalkCommitsResponse);
    rpc GetMergeBase(GetMergeBaseRequest) returns (GetMergeBaseResponse);
    rpc MergeFastForward(MergeFastForwardRequest) returns (MergeFastForwardResponse);
    rpc Push(PushRequest) returns (PushResponse);
    rpc UploadChunks(stream ChunkUploadRequest) returns (UploadChunksResponse);
    rpc DownloadChunks(stream DownloadChunksRequest) returns (stream DownloadChunk);
}
