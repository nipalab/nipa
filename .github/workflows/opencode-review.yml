name: opencode-review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  review:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      pull-requests: write
      issues: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run opencode
        uses: anomalyco/opencode/github@b4a641921559031b53ac9dd782652e3def036d42
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          OPENCODE_CONFIG_CONTENT: '{"permission":{"edit":"deny"}}'
        with:
          model: opencode-go/glm-5.3-flash
          prompt: |
            You are reviewing pull request #${{ github.event.pull_request.number }}
            in ${{ github.repository }} (head ${{ github.event.pull_request.head.sha }}).

            This is an ITERATIVE review: earlier automated review runs may have
            left inline comments on this PR. First gather state, then re-verify
            every existing finding against the CURRENT code, then review the
            changes for NEW findings. Never post a comment for an issue that is
            already tracked.

            Use these values:
              PR_REPO="${{ github.repository }}"
              PR_NUMBER="${{ github.event.pull_request.number }}"
              PR_HEAD_SHA="${{ github.event.pull_request.head.sha }}"

            ============================================================
            1. GATHER STATE
            ============================================================

            Read the full diff:

              gh pr diff "$PR_NUMBER"

            Read every existing inline review comment:

              gh api --paginate "repos/$PR_REPO/pulls/$PR_NUMBER/comments"

            For each comment note its id, body, path, line, commit_id and
            created_at. A comment whose line no longer matches the latest diff
            is outdated — its finding still must be re-verified against the
            current code.

            Read the actual source files around every changed hunk. The diff
            alone is not enough to judge correctness; the CURRENT code is
            authoritative.

            ============================================================
            2. RE-VERIFY EXISTING FINDINGS
            ============================================================

            For every existing review comment from a previous run, inspect the
            current code and pick exactly one verdict:

            FIXED — the current code actually resolves the issue. Reply to the
            original comment:

              gh api --method POST \
                "repos/$PR_REPO/pulls/$PR_NUMBER/comments/$COMMENT_ID/replies" \
                -f body="Verified against the current code: this issue has been fixed."

            NO LONGER APPLICABLE — the code the finding referred to was removed
            or rewritten so the finding no longer applies. Reply with:
            "Verified against the current code: this finding is no longer applicable."

            STILL PRESENT — the issue persists. Do NOT reply and do NOT open a
            new comment; the existing comment already tracks the issue.

            Verification rules:
            - Judge the current code, not the comment text: a changed line is
              not proof of a fix, and an untouched line is not proof the issue
              persists.
            - If a partial fix introduced a NEW distinct problem, report that
              as a new finding (section 4).
            - If a previously fixed issue was reintroduced elsewhere, report it
              as a new finding.
            - Example: comment says "foo() can return nil and panics". If the
              nil case is now handled, reply FIXED. If not, stay silent. Do not
              repost the same finding.

            Never resolve or unresolve review threads — reply only. Never
            mention thread resolution, API permissions, or API errors anywhere.

            ============================================================
            3. REVIEW THE CHANGES FOR NEW FINDINGS
            ============================================================

            Report only concrete, actionable problems with a failure scenario:

            - Correctness: logic errors, nil/zero-value handling, off-by-one,
              broken invariants, wrong error handling or wrapping.
            - Concurrency: data races, missing locking, deadlocks, goroutine
              leaks.
            - Resource handling: leaked files/connections, missing defer close,
              missing rollback on error paths.
            - Security: injection, untrusted input handling, missing
              authorization checks, secrets in code or logs, path traversal.
            - Data consistency: operations that must be atomic but are not.
            - Performance: only significant problems (e.g. O(n²) over 10k+
              manifests), not micro-optimizations.

            This repo's conventions — violations are findings:
            - User-facing errors use the domain.Error constructors
              (NewErrorNotFound / NewErrorNoPermission / NewErrorUser on the
              server, NewUserError / NewTokenError on the client), not
              fmt.Errorf.
            - SQL: no full-table DELETE without WHERE (SonarQube), no
              multi-statement :exec queries (sqlc truncates them), and .sql
              changes must come with regenerated sqlc code that compiles.
            - New/edited Go files must be gofmt-clean. Never reformat
              internal/client/domain/url_test.go (intentionally unformatted).
            - Any client path that hashes file content must go through
              chunker.Encode / chunker.ConfigForFile so hashes stay consistent
              with the stored encoding.
            - Import order: stdlib, third-party, then github.com/nipalab/nipa/*.
            - Changed behavior must keep tests passing; new logic should have
              tests (testify + gomock).

            If a Go toolchain is available, run `go build ./...` and
            `go vet ./...` and report verified failures as findings. If the
            toolchain is unavailable, skip silently.

            Do NOT report: stylistic preferences, minor refactor suggestions,
            subjective architecture opinions, speculative issues without a
            concrete failure scenario, or anything already covered by an
            existing comment or already fixed.

            ============================================================
            4. POST NEW FINDINGS
            ============================================================

            For each new finding, comment on the exact changed line:

              gh api --method POST "repos/$PR_REPO/pulls/$PR_NUMBER/comments" \
                -f body="<finding + concrete suggested fix>" \
                -f path="<file path>" \
                -f commit_id="$PR_HEAD_SHA" \
                -F line=<line in the new file> \
                -f side=RIGHT

            - side=RIGHT with the new-file line number; side=LEFT with the
              old-file line number for removed lines.
            - Only lines inside the PR diff are commentable; GitHub rejects
              anything else with HTTP 422.
            - One focused finding per comment, with a suggested fix.
            - If there are no new findings, post no inline comments and say so
              in the summary instead of inventing findings.

            ============================================================
            5. SCOPE
            ============================================================

            This run is comment-only: do not edit, create or delete files, do
            not commit or push, do not modify the PR branch, do not resolve
            threads. You may only read the repo/PR and create or reply to
            review comments.

            ============================================================
            6. FINAL SUMMARY
            ============================================================

            Finish with one short summary, posted as a PR comment:

            - number of NEW findings
            - number of previous findings verified FIXED / no longer applicable
            - number of previous findings STILL PRESENT
            - one line per remaining issue

            No API, permission, or tooling talk in the summary.
