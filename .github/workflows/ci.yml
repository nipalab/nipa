name: Build and Test

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...
      
      - name: Run Tests & Generate Reports
        run: |
          set -o pipefail
          go test -race ./... 2>&1 | tee report.json

      - name: Generate Coverage Report
        run: go test -coverprofile=coverage.out -covermode=atomic -coverpkg=./... ./...

      - name: Upload Test and Coverage Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-and-coverage-reports
          path: |
            coverage.out
            report.json
          retention-days: 1

  client-e2e:
    name: Client e2e (${{ matrix.edition }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Each edition exercises one email transport end to end.
        include:
          - edition: free
            email_transport: sendgrid
          - edition: ee
            email_transport: http
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # The harness starts postgres + minio via docker compose for the ee
      # edition and tears them down afterwards; GitHub runners ship Docker
      # and the compose v2 plugin.
      - name: Run client e2e suite
        run: NIPA_TEST_EMAIL_TRANSPORT=${{ matrix.email_transport }} tests/run.sh ${{ matrix.edition }}

      - name: Upload harness logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: client-e2e-${{ matrix.edition }}-logs
          path: tests/.tmp/logs
          retention-days: 3

  sonarqube:
    name: SonarQube
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 
      - name: Download coverage report
        uses: actions/download-artifact@v4
        with:
          name: test-and-coverage-reports
          path: .
      - name: Verify coverage file
        run: |
          if [ -f coverage.out ]; then
            echo "✅ Coverage file found"
            echo "Coverage file size: $(wc -c < coverage.out) bytes"
            echo "Coverage file lines: $(wc -l < coverage.out) lines"
          else
            echo "❌ Coverage file not found!"
            exit 1
          fi
      - name: Verify report file
        run: |
          if [ -f report.json ]; then
            echo "✅ Report file found"
            echo "Report file size: $(wc -c < report.json) bytes"
            echo "Report file lines: $(wc -l < report.json) lines"
          else
            echo "❌ Report file not found!"
            exit 1
          fi
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      - name: SonarQube Quality Gate check
        uses: sonarsource/sonarqube-quality-gate-action@7a5fffe8e523c40e0c740b6bc2712ab503e52efa
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
