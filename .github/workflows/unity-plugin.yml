name: Unity plugin

on:
  push:
    branches:
      - main
    paths:
      - 'plugins/unity/**'
      - '.github/workflows/unity-plugin.yml'
  pull_request:
    paths:
      - 'plugins/unity/**'
      - '.github/workflows/unity-plugin.yml'
    types: [opened, synchronize, reopened]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Test
        run: make unity-test

      - name: Coverage gate
        run: |
          report=$(ls -t plugins/unity/dotnet/TestResults/*/coverage.cobertura.xml | head -1)
          rate=$(sed -n 's/.*<coverage line-rate="\([0-9.]*\)".*/\1/p' "$report" | head -1)
          echo "line coverage: $rate"
          awk -v r="$rate" 'BEGIN { exit (r >= 0.8) ? 0 : 1 }' || { echo "Editor/Core coverage below 80%"; exit 1; }

      - name: Pack
        run: make unity-pack

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unity-coverage
          path: plugins/unity/dotnet/TestResults/**/coverage.cobertura.xml

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: unity-package
          path: bin/com.nipalab.nipa-*.tgz

  editmode:
    if: ${{ vars.UNITY_LICENSE_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create test project
        run: |
          mkdir -p ci-project/Assets ci-project/ProjectSettings ci-project/Packages
          cat > ci-project/Packages/manifest.json <<EOF
          {
            "dependencies": {
              "com.nipalab.nipa": "file:../../plugins/unity/com.nipalab.nipa",
              "com.unity.test-framework": "1.4.5"
            },
            "testables": ["com.nipalab.nipa"]
          }
          EOF

      - uses: game-ci/unity-test-runner@32e57712352b500e17974b245a6dce9e11a73213 # v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: ci-project
          unityVersion: 2022.3.62f1
          testMode: editmode
          githubToken: ${{ secrets.GITHUB_TOKEN }}
