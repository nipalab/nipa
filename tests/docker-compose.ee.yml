services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: nipa
      POSTGRES_USER: nipa
      POSTGRES_PASSWORD: nipa
    ports:
      - "${NIPA_TEST_PG_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U nipa -d nipa"]
      interval: 2s
      timeout: 5s
      retries: 60

  redis:
    image: redis:7
    ports:
      - "${NIPA_TEST_REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 60

  minio:
    image: docker.io/pgsty/minio:latest
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    ports:
      - "${NIPA_TEST_S3_PORT:-55900}:9000"
