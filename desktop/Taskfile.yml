version: '3'

vars:
  APP_NAME: "nipa-desktop"
  BIN_DIR: "bin"
  PACKAGE_MANAGER: '{{.PACKAGE_MANAGER | default "npm"}}'
  VITE_PORT: '{{.WAILS_VITE_PORT | default 9245}}'
  GOOS: '{{.GOOS | default OS}}'
  # Linux builds use GTK4/WebKitGTK 6.0; hosts that only ship WebKitGTK 4.1
  # fall back to the legacy GTK3 backend. `wails3 build EXTRA_TAGS=...` wins.
  EXTRA_TAGS:
    sh: '{{if eq OS "linux"}}pkg-config --exists webkitgtk-6.0 2>/dev/null || echo gtk3{{else}}true{{end}}'
  # Release identity: `wails3 task release VERSION=v1.2.3` (or
  # NIPA_RELEASE_VERSION) overrides `git describe`. Release builds pin the
  # update key with NIPA_UPDATE_PUBLIC_KEY (base64 ed25519) and may move the
  # feed with UPDATE_FEED. The bundled CLI carries the same version.
  GIT_VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null || true
  VERSION: '{{.NIPA_RELEASE_VERSION | default .GIT_VERSION}}'
  SEMVER: '{{trimPrefix "v" .VERSION}}'
  NUMERIC_VERSION: '{{regexFind "^[0-9]+\\.[0-9]+\\.[0-9]+" .SEMVER | default "0.0.0"}}'
  VERSION_LDFLAGS: >-
    -X github.com/nipalab/nipa/internal/version.Version={{.VERSION}}
    {{- if .NIPA_UPDATE_PUBLIC_KEY}} -X github.com/nipalab/nipa/desktop/internal/update.PublicKey={{.NIPA_UPDATE_PUBLIC_KEY}}{{end}}
    {{- if .UPDATE_FEED}} -X github.com/nipalab/nipa/desktop/internal/update.FeedURL={{.UPDATE_FEED}}{{end}}

includes:
  common: ./build/Taskfile.yml
  windows: ./build/windows/Taskfile.yml
  darwin: ./build/darwin/Taskfile.yml
  linux: ./build/linux/Taskfile.yml

tasks:
  build:
    summary: Builds the application
    cmds:
      - task: "{{.GOOS}}:build"

  package:
    summary: Packages a production build of the application
    cmds:
      - task: "{{.GOOS}}:package"

  version:
    summary: Prints the release version the build would carry
    cmds:
      - echo "{{.VERSION}} ({{.NUMERIC_VERSION}})"

  release:
    summary: Builds the signed-update release artifacts for this OS into bin/release
    cmds:
      - task: "{{.GOOS}}:release"

  run:
    summary: Runs the application
    cmds:
      - task: "{{.GOOS}}:run"

  dev:
    summary: Runs the application in development mode
    cmds:
      - wails3 dev -config ./build/config.yml -port {{.VITE_PORT}}

  test:
    summary: Runs the Go and frontend tests
    cmds:
      - go test {{if .EXTRA_TAGS}}-tags {{.EXTRA_TAGS}}{{end}} -cover ./internal/...
      - task: common:install:frontend:deps
      - task: common:frontend:run
        vars: { SCRIPT: "lint" }
      - task: common:frontend:run
        vars: { SCRIPT: "test" }

  install:msix:tools:
    summary: Installs tools required for Windows MSIX packaging
    cmds:
      - task: windows:install:msix:tools
