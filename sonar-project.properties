sonar.projectKey=nipalab_nipa
sonar.organization=nipalab

# This is the name and version displayed in the SonarCloud UI.
#sonar.projectName=nipa
#sonar.projectVersion=1.0


# Path is relative to the sonar-project.properties file. Replace "\" by "/" on Windows.
#sonar.sources=.

# Encoding of the source code. Default is default system encoding
#sonar.sourceEncoding=UTF-8

sonar.language=go

# The cmd mains, tests/cmd/** (S3 bucket helper), tests/load/** (load
# runner) and **/testdata/** (offline fixture generators) are harnesses with
# no unit tests by design; excluding them keeps them out of the quality gate.
sonar.exclusions=plugins/godot/thirdparty/**,plugins/godot/core/tests/**,plugins/godot/extension/**,plugins/godot/tests/project/addons/gdUnit4/**,**/*_test.go,**/*.test.ts,**/*.test.tsx,desktop/frontend/src/test/**,internal/repository/sqlc/**,ee/repository/postgres/sqlc/**,ee/db/migrations/**,internal/http/swagger/**,db/**,cmd/migrate/main.go,cmd/nipad/main.go,cmd/nipa/main.go,cmd/nipa/registry.go,ee/cmd/nipad/main.go,ee/cmd/migrate/main.go,web/src/**,web/vite.config.ts,desktop/main.go,desktop/build/**,desktop/frontend/bindings/**,desktop/frontend/src/components/ui/**,desktop/frontend/src/main.tsx,desktop/frontend/*.config.ts,desktop/internal/connector/detach_*.go,tests/cmd/**,tests/load/**,**/testdata/**

# The EE postgres repositories deliberately mirror internal/repository/sqlite
# (parallel dialect backends sharing the same domain contract), so they are
# excluded from copy-paste detection only.
sonar.cpd.exclusions=ee/repository/postgres/**

sonar.go.coverage.reportPaths=coverage.out,desktop/coverage.out
sonar.javascript.lcov.reportPaths=desktop/frontend/coverage/lcov.info

sonar.go.tests.reportPaths=report.json

# The godot-cpp glue (plugins/godot/extension) is excluded like the cmd mains:
# it only runs inside the editor and is covered by the headless load check.
# Generic coverage XML for the C++ core (plugins/godot), produced by make godot-test.
sonar.coverageReportPaths=plugins/godot/coverage.xml

sonar.sources=.

sonar.tests=.

sonar.test.inclusions=**/*_test.go,plugins/godot/core/tests/**
